<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A cybersecurity roguelike: triage phishing, read firewall rules, peel encodings, hunt attacks in logs and contain malware before the breach meter hits 100%.">
<meta name="theme-color" content="#0a0f1e">
<meta property="og:title" content="Hexbreak">
<meta property="og:description" content="A cybersecurity roguelike: triage phishing, read firewall rules, peel encodings, hunt attacks in logs and contain malware before the breach meter hits 100%.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>html,body{margin:0}</style>
</head>
<body>
<title>Hexbreak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one narrow console column. HUD strip on top, a single stage below that swaps screens. Single dark look by choice (a night-shift SOC console). */
:root{
  color-scheme:dark;
  --ink:#0a0f1e; --panel:#111a31; --panel2:#18233f; --line:#2b3a66;
  --text:#dde5ff; --dim:#8a97c0;
  --amber:#ffb23e; --cyan:#56d6e8; --red:#ff5470; --green:#5fe0a0; --violet:#b39bff;
  --display:'Chakra Petch','Trebuchet MS',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
#bgfx{position:fixed;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:26px} h3{font-size:17px}
p{margin:0}
code,kbd,.mono{font-family:var(--mono)}
kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.65;margin-left:6px}
@media (hover:none){kbd{display:none}}
label,.lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* buttons */
.btn{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 18px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s}
@media(hover:hover){.btn:hover{border-color:var(--cyan)}} .btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible,.card:focus-visible,.bit:focus-visible,.logline:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber)}@media(hover:hover){ .btn.primary:hover{background:#ffc566}}
.btn.danger{border-color:var(--red);color:var(--red)}@media(hover:hover){ .btn.danger:hover{background:rgba(255,84,112,.12)}}
.btn.ok{border-color:var(--green);color:var(--green)}@media(hover:hover){ .btn.ok:hover{background:rgba(95,224,160,.12)}}
.btn.ghost{background:transparent} .btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.hud b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;display:block}
.meter{height:8px;background:var(--ink);border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .5s}
#hbv{display:inline;font-size:13px;color:var(--amber)}
#hco.hot{color:var(--amber)}
@media(max-width:560px){.hud{grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px 10px;padding:8px 12px}.hbreach{grid-column:1/-1}.hud b{font-size:15px}}

/* home */
.hero{padding:26px 0 6px}
.hero h1{font-size:clamp(46px,13vw,92px);line-height:.9;letter-spacing:.01em}
.hero h1 span{color:var(--amber)}
.hero .tag{font-family:var(--mono);color:var(--cyan);margin-top:12px;font-size:14px}
.hero .tag::after{content:'_';animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.rank{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end}
.rank .name{font-family:var(--display);font-size:22px;font-weight:700;color:var(--amber)}
.xp{grid-column:1/-1;height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div b{font-family:var(--mono);font-size:20px;display:block;font-variant-numeric:tabular-nums}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu .btn{text-align:left;padding:14px 16px}
.menu .btn small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;letter-spacing:0;color:var(--dim);margin-top:2px}
.menu .btn.primary small{color:#5a3d07}
.menu .wide{grid-column:1/-1}
@media(max-width:480px){.menu{grid-template-columns:1fr}}

/* node cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:8px;font-family:var(--body);font-size:14px;transition:transform .12s,border-color .12s}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:var(--amber)}}
.card .glyph{font-family:var(--mono);font-weight:600;font-size:26px;color:var(--cyan)}
.card h3{font-size:19px}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim)}
.card.hard{border-color:#6b3550} .card.hard .glyph{color:var(--red)}
.card.special .glyph{color:var(--green)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--dim)}
.chip.red{color:var(--red);border-color:var(--red)} .chip.amber{color:var(--amber);border-color:var(--amber)} .chip.green{color:var(--green);border-color:var(--green)}
.path{display:flex;gap:6px;align-items:center}
.path i{width:26px;height:6px;border-radius:3px;background:var(--line)} .path i.done{background:var(--green)} .path i.cur{background:var(--amber)} .path i.boss{width:38px}
.pips{font-family:var(--mono);color:var(--amber);letter-spacing:.2em}
.pips s{color:var(--line);text-decoration:none}

/* game frame */
.game,.brief,.result{display:flex;flex-direction:column;gap:14px}
.ghead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.gtag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.gprog{font-family:var(--mono);color:var(--dim);font-size:13px}
.timer{position:relative;height:22px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tfill{position:absolute;inset:0;background:var(--cyan);transform-origin:left;opacity:.85}
.tfill.low{background:var(--red)}
.timer span{position:absolute;right:8px;top:0;line-height:20px;font-family:var(--mono);font-size:12px;color:var(--text);mix-blend-mode:difference}
.timer.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.brief{padding:20px 0}.brief h2{font-size:34px}.brief .glyph{color:var(--cyan);font-family:var(--mono);margin-right:12px}
.brief p{max-width:60ch}.keys{font-family:var(--mono);font-size:13px;color:var(--dim)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{padding:16px}
.verdict{display:flex;gap:12px;justify-content:space-between;align-items:center;border-radius:8px;padding:12px 14px;border:1px solid;animation:pop .18s}
.verdict.ok{border-color:var(--green);background:rgba(95,224,160,.08)} .verdict.bad{border-color:var(--red);background:rgba(255,84,112,.08)}
.verdict b{font-family:var(--display);margin-right:6px} .verdict.ok b{color:var(--green)} .verdict.bad b{color:var(--red)}
.verdict>div{min-width:0}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.hint{font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}

/* phish */
.mail{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:baseline}
.mrow .lab{width:62px;flex:none} .mrow code{color:var(--cyan);word-break:break-all}
.mbody{padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.fakelink{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;color:var(--cyan);text-decoration:underline;word-break:break-all}
.href{font-family:var(--mono);font-size:12.5px;color:var(--dim);word-break:break-all} .href code{color:var(--amber)}
.attach{align-self:flex-start;font-family:var(--mono);font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:6px 10px}

/* firewall */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:13.5px}
.rules li{display:grid;grid-template-columns:28px 64px minmax(0,1fr) minmax(0,1.3fr);gap:8px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.rules li.hitok{border-color:var(--green);background:rgba(95,224,160,.12)} .rules li.hitbad{border-color:var(--red);background:rgba(255,84,112,.14)}
.rules .ALLOW{color:var(--green)} .rules .DENY{color:var(--red)} .rules .n{color:var(--dim)}
.pkt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--panel2);border:1px solid var(--amber);border-radius:10px;padding:16px;animation:slide .18s}
.pkt b{display:block;font-family:var(--mono);font-size:clamp(15px,4.2vw,22px);word-break:break-all} .pkt small{color:var(--dim);font-size:12px}
@keyframes slide{from{transform:translateX(24px);opacity:0}}

/* decoder */
.cipher{font-family:var(--mono);font-size:clamp(14px,3.6vw,19px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;word-break:break-all;min-height:96px;color:var(--amber)}
.cipher.err{animation:shake .3s;border-color:var(--red)} .cipher.done{color:var(--green);border-color:var(--green)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tools .btn[data-k=undo]{grid-column:span 2}
@media(max-width:480px){.tools{gap:6px}.tools .btn{padding:10px 2px;font-size:13px;letter-spacing:0}}
.fl{cursor:pointer}.mbody .fl{border-radius:6px}.mbody p.fl,.lk{padding:4px 6px;margin:-4px -6px}
.lk{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
@media(hover:hover){.fl:hover{background:rgba(86,214,232,.08)}.rules.pick li:hover{border-color:var(--cyan)}}
.fl.hit{outline:2px solid var(--red);outline-offset:-2px;background:rgba(255,84,112,.1)}
.fl.miss{outline:2px dashed var(--dim);outline-offset:-2px}
.rules.pick li{cursor:pointer}
.nd.opt circle:not(.hitc){stroke:var(--violet)!important;stroke-width:6;stroke-dasharray:none!important}
@media(pointer:coarse){.rules.pick li{padding-block:9px}}
.trail{font-family:var(--mono);font-size:12px;color:var(--dim);min-height:18px}

/* logs */
.logs{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:12.5px}
.logline{display:grid;grid-template-columns:64px 118px 40px minmax(0,1fr) 34px;gap:8px;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:4px;color:var(--text);padding:6px 8px;cursor:pointer;font:inherit}
@media(hover:hover){.logline:hover{border-color:var(--line);background:var(--panel2)}}
.logline .p{word-break:break-all} .logline .t,.logline .ip{color:var(--dim)}
.logline.found{border-color:var(--green);background:rgba(95,224,160,.12)} .logline.wrong{border-color:var(--red);opacity:.5;pointer-events:none}
@media(max-width:560px){.logline{grid-template-columns:40px minmax(0,1fr) 34px}.logline .t,.logline .ip{display:none}}

/* bits */
.target{font-family:var(--mono);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.target .big{font-size:clamp(28px,8vw,44px);font-weight:600;color:var(--amber);line-height:1.2;word-break:break-all}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bit{font-family:var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--dim);padding:10px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bit b{font-size:clamp(20px,6vw,30px);color:var(--text)} .bit small{font-size:10px}
.bit.on{background:var(--cyan);border-color:var(--cyan);color:#06262c} .bit.on b{color:#06262c}
.bits.solved .bit.on{background:var(--green);border-color:var(--green)}
.cur{font-family:var(--mono);text-align:center;color:var(--dim)}

/* lock */
.grid{display:flex;flex-direction:column;gap:6px;align-items:center}
.grow{display:flex;gap:6px}
.cell{width:46px;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;place-items:center;font-family:var(--mono);font-size:22px;font-weight:600}
.cell.g{background:var(--green);color:#06301d;border-color:var(--green)} .cell.y{background:var(--amber);color:#3a2503;border-color:var(--amber)} .cell.n{background:var(--panel2);color:var(--dim)}
.cell.cur{border-color:var(--cyan)}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:420px;margin:0 auto;width:100%}
.pad .btn{padding:10px 0;font-family:var(--mono)} .pad .g{border-color:var(--green);color:var(--green)} .pad .y{border-color:var(--amber);color:var(--amber)} .pad .n{opacity:.3}
.pad .wide2{grid-column:span 3}

/* quiz */
.q{font-family:var(--display);font-size:clamp(19px,4.6vw,24px);font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opts .btn{text-align:left;font-family:var(--body);font-weight:600;letter-spacing:0}
.opts .btn.right{border-color:var(--green);background:rgba(95,224,160,.15)} .opts .btn.wrongp{border-color:var(--red);background:rgba(255,84,112,.15)}

/* result */
.result h2{font-size:38px} .result.win h2{color:var(--green)} .result.lose h2{color:var(--red)}
.tally{font-family:var(--mono);display:grid;grid-template-columns:1fr auto;gap:4px 20px;max-width:380px;font-variant-numeric:tabular-nums}
.tally .tot{border-top:1px solid var(--line);padding-top:6px;font-size:20px;color:var(--amber);font-weight:600}
.learn{display:flex;flex-direction:column;gap:8px}
.entry{border-left:3px solid var(--violet);padding:4px 0 4px 12px} .entry h3{color:var(--violet);font-size:15px} .entry p{font-size:14px;color:var(--text)}
.entry.new h3::after{content:'NEW';font-family:var(--mono);font-size:10px;margin-left:8px;color:var(--amber);letter-spacing:.1em}
.entry.locked{border-color:var(--line)} .entry.locked h3,.entry.locked p{color:var(--dim)}
.codex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:600px){.codex{grid-template-columns:1fr}}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:640px){.shop{grid-template-columns:1fr}}
.perk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.perk p{font-size:13.5px;color:var(--dim);flex:1}
.bossname{font-family:var(--display);font-size:clamp(44px,12vw,80px);font-weight:700;color:var(--red);line-height:1}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){.achs{grid-template-columns:1fr}}
.ach{border:1px solid var(--line);border-radius:8px;padding:10px 12px;opacity:.45} .ach.got{opacity:1;border-color:var(--amber)} .ach b{font-family:var(--display)} .ach p{font-size:13px;color:var(--dim)}
.game{position:relative}
#stage.paused #gbody{visibility:hidden}
#stage.paused .game::after{content:'Paused. Press Esc or the II button to resume.';position:absolute;top:150px;left:0;right:0;text-align:center;font-family:var(--mono);color:var(--amber)}
.hud.crit .meter{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,84,112,.4)}}
.pt{position:fixed;left:50%;top:40%;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:14;animation:pt .85s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(280deg);opacity:0}}
body.hurt::after{content:'';position:fixed;inset:0;box-shadow:inset 0 0 140px var(--red);pointer-events:none;z-index:13;animation:fade .5s forwards}
@keyframes fade{to{opacity:0}}
.card[disabled]{opacity:.45;cursor:not-allowed;transform:none;border-color:var(--line)}
.stars{font-family:var(--mono);color:var(--amber);letter-spacing:.15em}.stars s{color:var(--line);text-decoration:none}
.net{width:100%;height:auto;max-height:56vh;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:block}
.net line{stroke:var(--line);stroke-width:4;stroke-linecap:round}
.net line.hot{stroke:var(--red);stroke-dasharray:6 8;animation:dash .6s linear infinite}
.net line.dead{stroke:var(--red);opacity:.45}.net line.cut{opacity:.25;stroke-dasharray:3 9}
@keyframes dash{to{stroke-dashoffset:-14}}
.nd{cursor:pointer}.nd circle{fill:var(--panel2);stroke:var(--cyan);stroke-width:3;transition:fill .2s}
@media(hover:hover){.nd:hover circle{fill:var(--line)}}
.nd text{fill:var(--text);font-family:var(--mono);font-size:14px;font-weight:600;text-anchor:middle;pointer-events:none}
.nd.inf{cursor:default}.nd.inf circle{fill:var(--red);stroke:var(--red)}.nd.inf text{fill:#2a0610}
.nd.blk{cursor:default}.nd.blk circle{fill:var(--ink);stroke:var(--dim);stroke-dasharray:5 5}.nd.blk text{fill:var(--dim)}
.nd.tgt{cursor:default}.nd.tgt circle{stroke:var(--amber);fill:var(--panel2)}.nd.tgt text{fill:var(--amber)}
.spread{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}.spread i{display:block;height:100%;background:var(--red);transform-origin:left}
.pwlist{display:flex;flex-direction:column;gap:8px}
.pwlist .btn{display:flex;gap:14px;align-items:center;text-align:left;font-family:var(--mono);font-weight:400;letter-spacing:0;word-break:break-all}
.pwlist .rk{width:20px;flex:none;color:var(--green);font-weight:600}
.pwlist .btn.lockd{border-color:var(--green);background:rgba(95,224,160,.08)}
.pwlist .btn.nope{animation:shake .3s;border-color:var(--red)}
.commits{display:grid;gap:3px}
.commits button{height:28px;border-radius:4px;border:1px solid var(--cyan);background:var(--panel2);cursor:pointer;padding:0;font-family:var(--mono);font-size:10px;color:var(--dim)}
@media(hover:hover){.commits button:hover{background:var(--cyan)}}
.commits button.ok{background:rgba(95,224,160,.25);border-color:transparent;cursor:default}
.commits button.bad{background:rgba(255,84,112,.3);border-color:transparent;cursor:default}
.commits button.hit{background:var(--red);border-color:var(--red)}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
.kpads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpads .btn{padding:14px 0;display:flex;flex-direction:column;align-items:center;font-family:var(--mono)}
.kpads b{font-size:22px}.kpads small{color:var(--dim);font-weight:400}
.kpads .btn.lit{background:var(--cyan);border-color:var(--cyan);color:#06262c}

<script>
(()=>{'use strict';
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stage=$('#stage');
const dbg=o=>{if(window.__hx)window.__hx.cur=o};
const once=fn=>{let d=false;return(...a)=>{if(d)return;d=true;return fn(...a)}};

/* ---------- rng ---------- */
let _r=Math.random;

const rnd=()=>_r(),ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- save ---------- */
const KEY='hexbreak.v1';
const S={xp:0,best:0,runs:0,wins:0,daily:{},streak:0,lastDaily:'',codex:{},ach:{},g:{},cls:'ana',mute:false,music:true,blitz:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dstr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>dstr(new Date());

/* ---------- audio ---------- */
let AC=null;
function tone(f,d=.08,type='square',v=.04,when=0){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={ok(){tone(660,.07);tone(990,.09,'square',.04,.06)},bad(){tone(150,.22,'sawtooth',.05)},click(){tone(420,.03,'triangle',.04)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.04,i*.09))},lose(){[330,247,196,131].forEach((f,i)=>tone(f,.2,'sawtooth',.05,i*.13))}};
/* quiet generative backing track: a slow minor bass line that tightens when the breach is critical */
let mTick=0,mStep=0;const MB=[110,110,130.81,98,110,146.83,130.81,82.41],MH=[440,523.25,659.25,587.33,523.25,392,440,329.63];
function mnote(f,d,type,v){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}});
setInterval(()=>{if(!S.music||document.hidden||!AC)return;const hot=run&&run.breach>=70,every=hot?2:3;mTick++;if(mTick%every)return;const i=mStep++%16;
  if(i%2===0)mnote(MB[(i/2)%8]*(hot?1.06:1),.5,'sine',.045);if(i%4===2||(hot&&i%2===1))mnote(MH[(mStep*3)%8],.22,'triangle',.012)},150);

/* ---------- screen plumbing ---------- */
let keyFn=null,curTimer=null,pending=[],tickers=[],run=null;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function togglePause(){const t=curTimer;if(!t||t.done)return;t.hold=!t.hold;stage.classList.toggle('paused',!!t.hold)}
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;if(e.key==='Escape'){togglePause();return}if(curTimer&&curTimer.hold)return;if(keyFn&&keyFn(e)===true)e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&curTimer&&!curTimer.done&&!curTimer.hold)togglePause()});
function every(fn,ms){const id=setInterval(fn,ms);tickers.push(id);return id}
function burst(){if(reduced)return;const cs=['#ffb23e','#56d6e8','#5fe0a0','#b39bff'];for(let i=0;i<22;i++){const q=document.createElement('i');q.className='pt';q.style.setProperty('--dx',(Math.random()*2-1)*220+'px');q.style.setProperty('--dy',(-Math.random()*190-30)+'px');q.style.background=cs[i%4];document.body.appendChild(q);setTimeout(()=>q.remove(),850)}}
function buzz(p){try{if(!S.mute&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function hurt(){buzz(45);if(reduced)return;document.body.classList.add('hurt');setTimeout(()=>document.body.classList.remove('hurt'),500)}
function later(fn,ms){const id=setTimeout(fn,ms);pending.push(id);return id}
function clearScreen(){if(curTimer){curTimer.stop();curTimer=null}pending.forEach(clearTimeout);pending=[];tickers.forEach(clearInterval);tickers=[];keyFn=null;stage.classList.remove('paused')}
function show(html){clearScreen();stage.innerHTML=html;window.scrollTo(0,0)}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
function floatText(txt){const f=document.createElement('div');f.className='float';f.textContent=txt;document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
function frame(g,prog){clearScreen();stage.innerHTML=`<section class="game"><div class="ghead"><div><span class="gtag">${g.tag}</span><h2>${g.name}</h2></div><div class="row"><div class="gprog" id="gprog">${prog||''}</div><button class="btn ghost sm" id="pz" title="Pause (Esc)">II</button></div></div><div class="timer"><div class="tfill" id="tfill"></div><span id="tnum"></span></div><div id="gbody" class="stack"></div></section>`;window.scrollTo(0,0);$('#pz').onclick=togglePause;return $('#gbody')}
function startTimer(sec,onEnd){const m=run?run.mods.time*(run.boss&&run.boss.time||1):1;const t={tot:sec*m,left:sec*m,paused:false,done:false};let last=performance.now();
  const draw=()=>{const f=$('#tfill'),n=$('#tnum');if(!f)return;const fr=t.left/t.tot;f.style.transform=`scaleX(${fr})`;f.classList.toggle('low',fr<.25);n.textContent=t.left.toFixed(1)+'s'};
  t.iv=setInterval(()=>{const now=performance.now(),dt=Math.min(.25,(now-last)/1000);last=now;if(t.done)return;if(!t.paused&&!t.hold){t.left-=dt;const sec=Math.ceil(t.left);if(t.left/t.tot<.25&&sec!==t.lt){t.lt=sec;tone(1200,.03,'square',.025)}if(t.left<=0){t.left=0;t.done=true;clearInterval(t.iv);draw();onEnd();return}}draw()},50);
  t.stop=()=>{t.done=true;clearInterval(t.iv)};t.frac=()=>Math.max(0,t.left/t.tot);
  t.hit=s=>{t.left=Math.max(.05,t.left-s);const el=$('.timer');if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}};
  curTimer=t;draw();return t}
function verdict(el,ok,html,next,auto){const go=once(next);
  el.innerHTML=`<div class="verdict ${ok?'ok':'bad'}"><div><b>${ok?'Correct.':'Wrong.'}</b>${html}</div><button class="btn sm" id="vnext">Next<kbd>↵</kbd></button></div>`;
  $('#vnext',el).onclick=go;try{el.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'})}catch(e){}buzz(ok?12:[30,40,30]);keyFn=e=>{if(e.key==='Enter'||e.key===' '){go();return true}};if(auto)later(go,auto)}
const pips=d=>{const n=Math.max(1,Math.min(10,Math.round(d)));return '■'.repeat(n)+'<s>'+'■'.repeat(10-n)+'</s>'};

/* ---------- codex ---------- */
const CODEX={
typosquat:['Typosquatting','Attackers register domains one typo away from the real one: swapped, doubled or lookalike characters. Read the sender domain letter by letter.','phish'],
subdomain:['The subdomain trick','In bank.com.verify-login.net the registered domain is verify-login.net. Read right to left: the part just before the final .com/.net is who owns it.','phish'],
linkmismatch:['Link mismatch','Link text can say anything. The real destination is the URL underneath, so check it before you click. Sender addresses can be forged too.','phish'],
attachment:['Dangerous attachments','Double extensions like invoice.pdf.exe, plus .html, .iso and macro documents (.docm), are classic malware carriers.','phish'],
bec:['Business email compromise','An executive name on an outside address, secrecy, urgency and gift cards or wire transfers. Verify through a channel you already trust.','phish'],
iplink:['Raw IP links','Real services use named HTTPS domains. A login link to a bare IP address over http:// is a red flag.','phish'],
legit:['Not everything is phishing','Reporting real mail has a cost too. Judge a message by its sender domain, link destination and attachments, not by its tone.','phish'],
firstmatch:['First match wins','Firewalls read rules top to bottom and stop at the first match. Order matters: a broad rule placed above a specific one hides it.','fw'],
cidr:['CIDR notation','10.66.0.0/16 fixes the first 16 bits: any 10.66.x.x address. /24 fixes three octets, /8 fixes one. 172.16.0.0/12 covers 172.16 through 172.31.','fw'],
defaultdeny:['Default deny','A good ruleset ends by denying everything. Only traffic you explicitly allowed gets through.','fw'],
ports:['Well-known ports','22 SSH · 23 Telnet · 25 SMTP · 53 DNS · 80 HTTP · 443 HTTPS · 445 SMB · 3306 MySQL · 3389 RDP.','fw'],
base64:['Base64','Encoding, not encryption: anyone can reverse it. Spot it by the A-Z a-z 0-9 + / alphabet and = padding at the end.','dec'],
hexenc:['Hex encoding','Each byte becomes two characters from 0-9 a-f. 66 6c 61 67 spells "flag".','dec'],
caesar:['Caesar and ROT13','Shift ciphers move every letter a fixed distance. There are only 25 keys, so trying them all breaks it. Punctuation stays put, which gives it away.','dec'],
binary:['Binary text','ASCII characters are 8-bit numbers. 01100001 is 97, the letter a.','dec'],
layers:['Layered obfuscation','Malware and CTF flags often stack encodings. Peel from the outside in: name the outer layer by its alphabet, decode, repeat.','dec'],
sqli:['SQL injection','Input like \' OR \'1\'=\'1 changes the meaning of a database query. Fix: parameterized queries, never string-built SQL.','logs'],
xss:['Cross-site scripting','Injected <script> or onerror= runs in other visitors\' browsers and can steal sessions. Fix: encode output and set a Content Security Policy.','logs'],
trav:['Path traversal','../ sequences climb out of the intended folder to read files like /etc/passwd. Fix: resolve the path and check it stays inside the allowed directory.','logs'],
cmdi:['Command injection','A ; or | after expected input runs a second shell command. Fix: never pass user input to a shell; use argument arrays and allowlists.','logs'],
recon:['Reconnaissance probes','Requests for /.env, /.git/config or backup files are scanners looking for leaked secrets. Never deploy those files to a web root.','logs'],
brute:['Brute force','A burst of failed logins from one address, then a success, means a guessed password. Fix: rate limits, lockouts and MFA.','logs'],
bits:['Place values','Each bit is worth double the one to its right: 128 64 32 16 8 4 2 1. Any number 0-255 is a sum of those.','bits'],
hexnum:['Hex numbers','One hex digit is exactly four bits, so two digits make a byte. 0xAD is 1010 1101.','bits'],
bitwise:['Bitwise operators','AND keeps bits set in both inputs, OR in either, XOR in exactly one. XOR undoes itself, which is why ciphers are built on it.','bits'],
subnetmask:['Subnet masks','A /26 mask is 26 one-bits: 255.255.255.192. The last octet is 256 minus the block size (64).','bits'],
sidechannel:['Side channels','A check that reveals which part of a secret was right, by message or even by response time, can be cracked piece by piece. Compare in constant time and answer only pass or fail.','lock'],
lockout:['Attempt limits','Limiting guesses turns a brute force that takes seconds into one that takes centuries.','lock'],
cia:['The CIA triad','Confidentiality (only the right people read it), Integrity (it has not been altered), Availability (it is there when needed). Every control protects at least one.','quiz'],
replyto:['Reply-To mismatch','The From line can be forged to look right while replies quietly go to the attacker. Invoice and bank-detail fraud depends on it. Confirm payment changes by phone.','phish'],
urlenc:['URL encoding','%66%6c%61%67 is "flag": each byte written as % plus two hex digits. Attackers use it to slip payloads past naive filters.','dec'],
ssrf:['Server-side request forgery','A url= parameter pointed at 169.254.169.254 or an internal host makes the server fetch secrets for the attacker. Fix: allowlist destinations and block internal ranges.','logs'],
jndi:['Log4Shell','${jndi:ldap://...} in any logged field made vulnerable Java servers download and run remote code. One of the worst bugs of its decade: patch your dependencies.','logs'],
segment:['Containment','When malware is spreading, isolating hosts beats cleaning them. Segmented networks give you choke points; flat networks give you none.','quar'],
graph:['Graphs and cuts','A network is a graph. Asking "can the infection still reach the database?" is a breadth-first search, and the smallest set of hosts that disconnects them is a minimum cut.','quar'],
entropy:['Length beats complexity','Each extra random character multiplies the work for an attacker. Four random words or 12+ random characters beat a short password stuffed with symbols.','pw'],
dictionary:['Dictionary attacks','Crackers try leaked passwords first, then dictionary words with the usual tweaks: capital first letter, a year, ! at the end, @ for a. P@ssw0rd! falls in seconds.','pw'],
bsearch:['Binary search','Halving the suspects each step finds one item among a million in about 20 checks. It is why git bisect, sorted indexes and guessing games are fast: O(log n).','bis'],
userinfo:['The @ trick in links','In a web address, anything before an @ is a username that the browser ignores. https://bank.com@evil.net goes to evil.net.','phish'],
dispname:['Display-name spoofing','The name shown next to an email is free text that anyone can set. Only the address after the @ says where it came from.','phish'],
ascii:['ASCII','Every character is stored as a number: A is 65, a is 97, 0 is 48. Hex, binary and decimal encodings are just different ways to write those numbers.','bits'],
atbash:['Atbash','A substitution cipher that mirrors the alphabet: A becomes Z, B becomes Y. Like ROT13 it is its own inverse, and like every simple substitution it hides nothing from anyone who looks.','dec'],
twos:["Two's complement",'How computers store negative integers: flip every bit and add one. In one byte, 11111111 is −1 and 10000000 is −128.','bits'],
webshell:['Web shells','A script an attacker uploads to a server so they can run commands through ordinary web requests. Look for command parameters on files in upload folders.','logs'],
enum:['Enumeration','Walking through IDs one by one to harvest every record. Sequential requests from a single source are the tell; access checks and rate limits are the fix.','logs'],
infotheory:['Information and guessing','Every answer rules out possibilities. A guess that splits the remaining options evenly teaches the most, which is how thousands of codes shrink to one in a handful of tries.','lock'],
knock:['Port knocking','A hidden service that only opens after connection attempts hit a secret sequence of ports. It cuts scanner noise, but it is obscurity: real access control still has to sit behind it.','knock'],
};

G.bis={name:'Bisect',tag:'Binary search',glyph:'/2',how:'One commit slipped a backdoor into the codebase, and every commit after it is tainted too. Test a commit to learn whether it is clean or tainted. You only get a handful of tests, so halve the suspects every time.',keys:'Click or tap a commit to test it',

    $$('.commits button').forEach(b=>b.onclick=()=>test(+b.dataset.i))}
  function test(i){if(busy||i<=lo||i>=hi)return;const before=hi-lo;left--;used++;if(i>=bad){hi=i;tone(200,.08,'sawtooth',.04)}else{lo=i;tone(700,.06,'triangle',.04)}

G.quiz={name:'Rapid Recall',tag:'Core knowledge',glyph:'?',how:'Quick-fire questions on security and computer science fundamentals. One mistake is allowed.',keys:'Keys 1-4 pick an answer',
play(d,done){const lo=d<5?1:2,hi=d<3?1:d<5?2:3;const n=Math.min(9,5+Math.floor(d/2));const qs=shuffle(QS.filter(q=>q[0]>=lo&&q[0]<=hi)).slice(0,n);
  let i=0,miss=0,busy=false,opts;const allow=n>=8?2:1;const body=frame(this);
  const t=startTimer(n*Math.max(6,9-d*.3),()=>end(false,'Out of time'));
  const end=once((ok,note)=>{t.stop();done({win:ok&&miss<=allow,mistakes:miss,perfect:ok&&miss===0,frac:t.frac(),learn:['cia'],note:note||(miss>allow?'Too many wrong answers':''),game:'quiz'})});
  function render(){busy=false;const q=qs[i];opts=shuffle(q.slice(2,6));$('#gprog').textContent=`Question ${i+1} / ${qs.length}`;
    body.innerHTML=`<p class="q">${esc(q[1])}</p><div class="opts">${opts.map((o,j)=>`<button class="btn" data-j="${j}"><span class="mono" style="color:var(--dim)">${j+1}</span>&nbsp; ${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
    $$('.opts .btn').forEach(b=>b.onclick=()=>ans(+b.dataset.j));keyFn=e=>{if(e.key>='1'&&e.key<='4'){ans(+e.key-1);return true}}}
  function ans(j){if(busy)return;busy=true;const q=qs[i],ok=opts[j]===q[2];t.paused=true;$$('.opts .btn').forEach((b,k)=>{b.disabled=true;if(opts[k]===q[2])b.classList.add('right');else if(k===j)b.classList.add('wrongp')});
    ok?sfx.ok():(sfx.bad(),miss++);verdict($('#fb'),ok,' '+esc(q[6]),()=>{t.paused=false;i++;if(miss>allow)return end(false);if(i>=qs.length)return end(true);render()},ok?1100:0)}
  render()}};

function stat(id,res){const g=S.g[id]||(S.g[id]={p:0,w:0,f:0});g.p++;if(res.win)g.w++;if(res.perfect)g.f++;persist();if(stars(id)>=3)award('master');if(Object.keys(G).every(k=>S.g[k]&&S.g[k].w))award('poly')}
function settle(res,o){const out={lines:[],total:0,cr:0,br:0},noise=o.boss&&run.boss&&run.boss.noise||1;run.played++;stat(res.game,res);

    const base=Math.round((100+o.d*20)*(o.hard?1.5:1)*(o.boss?1.5:1)),speed=Math.round(base*.5*res.frac*run.mods.speed*(o.boss&&run.boss&&run.boss.nospeed?0:1)),perf=res.perfect?Math.round(base*.25*run.mods.perf):0,cm=mult(run.combo);
    out.total=Math.round((base+speed+perf)*cm*run.mods.score);out.lines=[['Node value',base],['Speed bonus',speed]];if(perf)out.lines.push(['Flawless',perf]);
    if(cm>1)out.lines.push([`Combo ×${cm.toFixed(2)}`,'']);if(run.mods.score!==1)out.lines.push([`Score modifier ×${run.mods.score.toFixed(1)}`,'']);
    run.score+=out.total;out.cr=Math.round((18+o.d*3)*(o.hard?1.5:1)*(o.boss?1.3:1)*run.mods.credit);if(run.interest)out.cr+=Math.min(20,Math.round(run.credits*.1));run.credits+=out.cr;out.br=Math.round(res.mistakes*3*run.mods.trace*noise);

function blitzQ(n){const r=Math.random(),lvl=n<6?1:n<16?2:3;
  if(r<.4){const q=pick(QS.filter(q=>q[0]<=lvl&&q[0]>=lvl-1));return{q:q[1],a:q[2],o:shuffle(q.slice(2,6))}}
  if(r<.55){const sv=pick(SV),oth=shuffle(SV.filter(x=>x!==sv)).slice(0,3);return rnd()<.5?{q:`Which service uses port ${sv.p}?`,a:sv.n,o:shuffle([sv,...oth]).map(x=>x.n)}:{q:`Which port does ${sv.n} use?`,a:''+sv.p,o:shuffle([sv,...oth]).map(x=>''+x.p)}}
  if(r<.75){const bits=lvl===1?4:lvl===2?6:8,v=ri(2,2**bits-1),hex=lvl>1&&rnd()<.4,opts=new Set([v]);while(opts.size<4){const w=v+pick([-16,-8,-4,-2,-1,1,2,4,8,16]);if(w>0)opts.add(w)}
    return{q:hex?`0x${v.toString(16).toUpperCase()} in decimal?`:`${v.toString(2).padStart(bits,'0')} in decimal?`,a:''+v,o:shuffle([...opts]).map(String)}}
  if(r<.88){const o=pick(ORGS),set=new Set([o.d]);while(set.size<4)set.add(typo(o.d));return{q:`Which is the real ${o.n} domain?`,a:o.d,o:shuffle([...set])}}
  const a=ri(1,15),b=ri(1,15),op=pick(['AND','OR','XOR']),v=op==='AND'?a&b:op==='OR'?a|b:a^b,opts=new Set([v]);while(opts.size<4)opts.add(ri(0,15));return{q:`${a} ${op} ${b} = ?`,a:''+v,o:shuffle([...opts]).map(String)}}
async function postBlitz(v){if(!DB||!UID||!v)return;try{const ref=DB.doc('scores/'+UID),snap=await ref.get(),o=snap.exists?snap.data()||{}:{};if((+o.blitz||0)>=v)return;
  await ref.set({best:+o.best||0,daily:+o.daily||0,dailyDate:o.dailyDate||'',rank:rankOf(S.xp),runs:+o.runs||0,blitz:v})}catch(e){}}
function blitz(){_r=Math.random;run=null;hud();sfx.click();let n=0,score=0,streak=0,top=0,q,busy=false;const body=frame({name:'Blitz',tag:'Survival mode'});
  const finish=once(()=>{const xp=Math.round(score/5),nb=score>S.blitz;if(nb)S.blitz=score;S.xp+=xp;persist();postBlitz(score);if(n>=25)award('reflex');if(n>=50)award('reflex2');nb&&score?(sfx.win(),burst()):sfx.lose();
    show(`<section class="result ${nb&&score?'win':'lose'}"><span class="gtag">Blitz</span><h2>${nb&&score?'New best.':'Time.'}</h2><div class="tally"><span class="tot">Score</span><span class="tot">${score.toLocaleString()}</span><span>Answered</span><span>${n}</span><span>Longest streak</span><span>${top}</span><span>Personal best</span><span>${S.blitz.toLocaleString()}</span><span>XP earned</span><span>+${xp}</span></div>
     <div class="row"><button class="btn primary" id="again">Again<kbd>↵</kbd></button><button class="btn" id="home">Home</button></div></section>`);
    $('#again').onclick=blitz;$('#home').onclick=home;keyFn=e=>{if(e.key==='Enter'){blitz();return true}}});
  const t=startTimer(30,finish);
  function render(){busy=false;q=blitzQ(n);$('#gprog').textContent=`Score ${score} · streak ${streak}`;
    body.innerHTML=`<p class="q">${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button class="btn" data-j="${j}"><span class="mono" style="color:var(--dim)">${j+1}</span>&nbsp; ${esc(o)}</button>`).join('')}</div><p class="hint">Right answers add time and build a streak bonus. A wrong answer burns four seconds.</p>`;
    $$('.opts .btn').forEach(b=>b.onclick=()=>ans(+b.dataset.j))}
  function ans(j){if(busy||t.done)return;busy=true;const ok=q.o[j]===q.a;$$('.opts .btn').forEach((b,k)=>{b.disabled=true;if(q.o[k]===q.a)b.classList.add('right');else if(k===j)b.classList.add('wrongp')});
    if(ok){streak++;top=Math.max(top,streak);n++;score+=10+Math.min(20,streak*2);t.left=Math.min(t.tot,t.left+Math.max(.8,2.3-n*.04));sfx.ok();later(render,150)}
    else{streak=0;sfx.bad();hurt();t.hit(4);later(render,800)}}
  keyFn=e=>{if(e.key>='1'&&e.key<='4'){ans(+e.key-1);return true}};render()}
function loadout(){const rk=rankOf(S.xp);sfx.click();
  show(`<section class="stack">${backBtn}<div><span class="gtag">New run</span><h2>Choose your operator</h2></div><div class="cards">${CLASSES.map((c,i)=>{const ok=rk>=c.rank;return `<button class="card" data-i="${i}" ${ok?'':'disabled'}><h3>${c.n}</h3><p>${c.x}</p><div class="meta"><span>${ok?(S.cls===c.id?'last used':''):'Unlocks at rank '+RANKS[c.rank][1]}</span><span>${ok?'['+(i+1)+']':''}</span></div></button>`}).join('')}</div><p class="hint">New operators unlock as you rank up. Enter picks the one you used last.</p></section>`);
  $('#back').onclick=home;const go=once(i=>newRun(false,CLASSES[i]));$$('.card:not([disabled])').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  keyFn=e=>{const i=+e.key-1;if(i>=0&&i<CLASSES.length&&rk>=CLASSES[i].rank){go(i);return true}if(e.key==='Enter'){const j=CLASSES.findIndex(c=>c.id===S.cls);go(j>=0&&rk>=CLASSES[j].rank?j:0);return true}}}
function practice(d){_r=Math.random;run=null;hud();
  show(`<section class="stack">${backBtn}<div><span class="gtag">Practice</span><h2>Pick a drill</h2></div><div class="row"><span class="lab">Difficulty</span><button class="btn sm" id="dm">−</button><span class="pips">${pips(d)}</span><button class="btn sm" id="dp">+</button></div>
   <div class="cards">${Object.entries(G).map(([id,g])=>`<button class="card" data-id="${id}"><span class="glyph">${g.glyph}</span><h3>${g.name}</h3><p>${g.tag}</p><div class="meta">${starsHTML(id)}<span>${S.g[id]?S.g[id].w+' / '+S.g[id].p+' won':'new'}</span></div></button>`).join('')}</div><p class="hint">Stars: one for 2 wins, two for 8 wins, three for 8 flawless clears. Runs count too.</p></section>`);
  $('#back').onclick=home;$('#dm').onclick=()=>practice(Math.max(1,d-1));$('#dp').onclick=()=>practice(Math.min(9,d+1));
  $$('.card').forEach(b=>b.onclick=()=>pracPlay(b.dataset.id,d))}
function pracPlay(id,d){playGame(id,d,{label:'Practice'},res=>{stat(id,res);if(res.win){sfx.win();burst();S.xp+=5;persist()}else{sfx.lose();hurt()}
  show(`<section class="result ${res.win?'win':'lose'}"><span class="gtag">Practice · ${G[id].name}</span><h2>${res.win?(res.perfect?'Flawless.':'Cleared.'):'Not this time.'}</h2>${res.note?`<p class="mono">${esc(res.note)}</p>`:''}${learnHTML(res)}
   <div class="row"><button class="btn primary" id="again">Again<kbd>↵</kbd></button>${d<9?'<button class="btn" id="harder">Harder</button>':''}<button class="btn" id="back">Drills</button></div></section>`);
  $('#again').onclick=()=>pracPlay(id,d);if($('#harder'))$('#harder').onclick=()=>pracPlay(id,d+1);$('#back').onclick=()=>practice(d);keyFn=e=>{if(e.key==='Enter'){pracPlay(id,d);return true}}})}
function codex(){show(`<section class="stack">${backBtn}<div><span class="gtag">Codex · ${Object.keys(S.codex).length} of ${Object.keys(CODEX).length}</span><h2>What you have learned</h2></div><div class="codex">${Object.keys(CODEX).map(k=>S.codex[k]?entryHTML(k):`<div class="entry locked"><h3>Locked</h3><p>Found in ${G[CODEX[k][2]].name}.</p></div>`).join('')}</div></section>`);$('#back').onclick=home}
function achs(){show(`<section class="stack">${backBtn}<div><span class="gtag">Achievements</span><h2>${Object.keys(S.ach).length} of ${Object.keys(ACH).length} earned</h2></div><div class="achs">${Object.entries(ACH).map(([k,a])=>`<div class="ach ${S.ach[k]?'got':''}"><b>${a[0]}</b><p>${a[1]}</p></div>`).join('')}</div></section>`);$('#back').onclick=home}

/* ---------- shared leaderboard (lights up only where the viewer has access) ---------- */
let DB=null,USER=null,UID=null;
(async()=>{try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use('db');USER=await window.claude.use('user');if(USER)UID=await USER.id()}catch(e){}})();
async function postScore(r){if(!DB||!UID||!r.score)return;try{const ref=DB.doc('scores/'+UID),snap=await ref.get(),o=snap.exists?snap.data()||{}:{},k=today();
  const n={best:Math.max(+o.best||0,r.score),daily:+o.daily||0,dailyDate:o.dailyDate||'',rank:rankOf(S.xp),runs:(+o.runs||0)+1,blitz:+o.blitz||0};
  if(r.daily){if(n.dailyDate!==k){n.dailyDate=k;n.daily=r.score}else n.daily=Math.max(n.daily,r.score)}
  await ref.set(n)}catch(e){}}
async function board(tab){tab=tab||'best';
  show(`<section class="stack">${backBtn}<div><span class="gtag">Leaderboard</span><h2>${tab==='best'?'All-time best runs':tab==='blitz'?'Blitz high scores':'Today\'s daily run'}</h2></div><div class="row"><button class="btn sm ${tab==='best'?'primary':''}" id="tb">All time</button><button class="btn sm ${tab==='daily'?'primary':''}" id="td">Today's daily</button><button class="btn sm ${tab==='blitz'?'primary':''}" id="tz">Blitz</button></div><div id="lb"><p class="mono" style="color:var(--dim)">Loading scores…</p></div><p class="hint">Scores post automatically when a run ends. Everyone you share this game with appears here once they finish a run.</p></section>`);
  $('#back').onclick=home;$('#tb').onclick=()=>board('best');$('#td').onclick=()=>board('daily');$('#tz').onclick=()=>board('blitz');const box=$('#lb');
  if(!DB){box.innerHTML='<p class="mono" style="color:var(--dim)">The leaderboard is not available in this view. Open the game signed in on claude.ai to see and post scores.</p>';return}
  try{const snap=await Promise.race([DB.collection('scores').limit(200).get(),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),10000))]);if(!box.isConnected)return;
    const k=today();let rows=snap.docs.map(x=>({id:x.id,...(x.data()||{})})).map(x=>({id:x.id,v:tab==='best'?+x.best||0:tab==='blitz'?+x.blitz||0:(x.dailyDate===k?+x.daily||0:0),rank:Math.max(0,Math.min(RANKS.length-1,+x.rank||0))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,25);
    if(!rows.length){box.innerHTML=`<p class="mono" style="color:var(--dim)">No scores yet. ${tab==='best'?'Finish a run to claim first place.':'Play today\'s daily run to set the mark.'}</p>`;return}
    let names={};try{if(USER)names=await USER.profiles(rows.map(x=>x.id))}catch(e){}if(!box.isConnected)return;
    box.innerHTML=`<div class="tablewrap"><table class="lb"><thead><tr><th>#</th><th>Operator</th><th>Rank</th><th class="num">Score</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${x.id===UID?'me':''}"><td class="mono">${i+1}</td><td>${esc((names[x.id]&&names[x.id].name)||'Operator')}${x.id===UID?' (you)':''}</td><td>${RANKS[x.rank][1]}</td><td class="num">${x.v.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
  catch(e){if(box.isConnected)box.innerHTML='<p class="mono" style="color:var(--dim)">Could not load scores right now. Try again in a moment.</p>'}}
function records(){const ids=Object.keys(G),tot=ids.reduce((a,k)=>{const g=S.g[k]||{p:0,w:0,f:0};a.p+=g.p;a.w+=g.w;a.f+=g.f;return a},{p:0,w:0,f:0});
  show(`<section class="stack">${backBtn}<div><span class="gtag">Records</span><h2>${tot.w} of ${tot.p} challenges won</h2></div><div class="tablewrap"><table class="lb"><thead><tr><th>Challenge</th><th>Mastery</th><th class="num">Won</th><th class="num">Played</th><th class="num">Flawless</th><th class="num">Win rate</th></tr></thead><tbody>${ids.map(k=>{const g=S.g[k]||{p:0,w:0,f:0};return `<tr><td>${G[k].name}</td><td>${starsHTML(k)}</td><td class="num">${g.w}</td><td class="num">${g.p}</td><td class="num">${g.f}</td><td class="num">${g.p?Math.round(g.w/g.p*100)+'%':'-'}</td></tr>`}).join('')}</tbody></table></div>
   <div class="panel stats"><div><span class="lab">Best score</span><b>${S.best.toLocaleString()}</b></div><div><span class="lab">Runs</span><b>${S.runs}</b></div><div><span class="lab">Contracts won</span><b>${S.wins}</b></div><div><span class="lab">Total XP</span><b>${S.xp.toLocaleString()}</b></div></div></section>`);$('#back').onclick=home}

/* ---------- background hex drift ---------- */
(function(){const c=$('#bgfx');if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const x=c.getContext('2d');let w,h,cols,ys;
  const size=()=>{w=c.width=innerWidth;h=c.height=innerHeight;cols=Math.ceil(w/34);ys=Array.from({length:cols},()=>Math.random()*h)};size();addEventListener('resize',()=>{if(innerWidth!==w||Math.abs(innerHeight-h)>120)size()});
  setInterval(()=>{if(document.hidden)return;x.fillStyle='rgba(10,15,30,.18)';x.fillRect(0,0,w,h);x.font='13px monospace';x.fillStyle='#56d6e8';
    for(let i=0;i<cols;i++){x.fillText((Math.random()*256|0).toString(16).padStart(2,'0'),i*34+6,ys[i]);ys[i]+=16;if(ys[i]>h&&Math.random()<.08)ys[i]=0}},90)})();

window.__hx={home,blitzQ,EVENTS,G,genDec,DEC,caesar,genNet,minCut,reach,genLog,genBit,mkEmail,genRules,fwEval,PWT,QS,CODEX,setSeed:n=>{_r=mulberry(n)}};
home();
})();
</script>
